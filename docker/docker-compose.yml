networks:
  unifiap_net:
    # Nome fixo: "docker network inspect unifiap_net" funciona de qualquer pasta
    name: unifiap_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1

volumes:
  shared_logs:
    driver: local

services:
  api-pagamentos:
    build:
      context: ../api-pagamentos
      dockerfile: Dockerfile
    container_name: api-pagamentos
    env_file:
      - .env
    networks:
      unifiap_net:
        ipv4_address: 172.25.0.10
    volumes:
      - shared_logs:/var/logs/api
      - ./pix.key:/app/pix.key:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # A imagem python:slim não tem curl: o teste usa o próprio Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  auditoria-service:
    build:
      context: ../auditoria-service
      dockerfile: Dockerfile
    container_name: auditoria-service
    networks:
      unifiap_net:
        ipv4_address: 172.25.0.20
    environment:
      # No compose a auditoria fica em loop; no Kubernetes o CronJob roda em modo "once"
      EXECUTION_MODE: continuous
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-60}
    volumes:
      - shared_logs:/var/logs/api
    restart: unless-stopped
    depends_on:
      api-pagamentos:
        condition: service_healthy
