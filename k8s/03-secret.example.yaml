# Exemplo do Secret usado pela api-pagamentos. NÃO coloque a chave real aqui.
# O deploy cria o Secret de verdade a partir do docker/pix.key local:
#   ./scripts/criar-secret.sh
# que equivale a:
#   kubectl create secret generic unifiapay-secrets -n unifiapay --from-file=pix.key=docker/pix.key
apiVersion: v1
kind: Secret
metadata:
  name: unifiapay-secrets
  namespace: unifiapay
  labels:
    app: unifiapay
type: Opaque
stringData:
  pix.key: |
    -----BEGIN PIX SIMULATION KEY-----
    EXEMPLO-FICTICIO-TROQUE-PELA-SUA-CHAVE
    -----END PIX SIMULATION KEY-----
