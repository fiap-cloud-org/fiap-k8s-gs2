apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifiapay-logs-pvc
  namespace: unifiapay
  labels:
    app: unifiapay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # "standard" é a StorageClass padrão do kind (local-path).
  # ReadWriteOnce basta porque o kind tem um nó só: todos os Pods que montam
  # o livro-razão rodam no mesmo nó. Em um cluster com vários nós, use uma
  # StorageClass com ReadWriteMany (NFS, EFS, Azure Files...).
  storageClassName: standard
